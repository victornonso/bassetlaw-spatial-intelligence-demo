[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bassetlaw-spatial-intelligence-demo"
version = "0.1.0"
description = "Independent public-data interview prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "shapely>=2.1,<3", "pyproj>=3.6,<4", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
