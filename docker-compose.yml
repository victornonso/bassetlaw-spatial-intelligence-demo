services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: spatial_demo
      POSTGRES_USER: spatial_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spatial_db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  spatial_db:
